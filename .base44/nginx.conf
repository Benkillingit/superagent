# Dev-preview server for the static app.
#
# The repo root is mounted at /usr/share/nginx/html and served straight off
# disk, so edits to index.html show up on the next reload — no rebuild.
#
# This is a complete nginx.conf (not just a server block) because the sandbox
# checkout is owned by root with 0700 permissions, so nginx has to keep its
# workers running as root to be able to read it.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Never let the browser serve a stale copy of an edited file.
        add_header Cache-Control "no-store" always;

        # Don't expose repository metadata (.git, dotfiles) over the preview.
        location ~ ^/\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
